# Weekly canary. yt-dlp updates at RUNTIME in every user session
# (bootstrap.sh installs the nightly channel), so this workflow never releases
# anything — it detects breakage early and opens an issue.
#
# Two tiers:
#   1. Deterministic (always enforced): nightly pip install works, scripts are
#      syntactically valid, and the transcript cleaning pipeline produces the
#      committed expected output from a fixture VTT (tests/fake-ytdlp stubs the
#      download via the $YTDLP_BIN hook — the real script logic runs).
#   2. Network (best effort): a real YouTube transcript + download. YouTube
#      bot-checks GitHub's datacenter IPs ("Sign in to confirm you're not a
#      bot"), which says nothing about user sessions on other egress — that
#      exact signature is reported as inconclusive; any OTHER failure fails
#      the run and opens an issue.
name: canary
on:
  schedule:
    - cron: "23 7 * * 1" # Mondays 07:23 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      # Fixtures verified 2026-09-07. Transcript: NASA (US-government work,
      # human captions). Download: Big Buck Bunny (CC-BY, Blender Foundation).
      FIXTURE_TRANSCRIPT_URL: "https://www.youtube.com/watch?v=_T8cn2J13-4"
      FIXTURE_DOWNLOAD_URL: "https://www.youtube.com/watch?v=aqz-KE-bpKQ"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp (nightly channel — same as the skill's bootstrap)
        run: python3 -m pip install -U --pre "yt-dlp[default]"
      - name: Shell syntax
        run: |
          for f in skills/media-toolkit/scripts/* scripts/build-zip.sh tests/fake-ytdlp; do
            bash -n "$f" && echo "ok: $f"
          done
      - name: Unit test — transcript cleaning pipeline (no network)
        run: |
          YTDLP_BIN="$PWD/tests/fake-ytdlp" skills/media-toolkit/scripts/yt-transcript \
            "https://example.invalid/x" | diff - tests/expected.txt
          YTDLP_BIN="$PWD/tests/fake-ytdlp" skills/media-toolkit/scripts/yt-transcript \
            -t "https://example.invalid/x" | diff - tests/expected-timestamps.txt
          echo "cleaning pipeline OK (plain + timestamps)"
      - name: Network test — real YouTube (datacenter IPs may be bot-checked)
        run: |
          set +e
          log=$(mktemp)
          skills/media-toolkit/scripts/yt-transcript -l en "$FIXTURE_TRANSCRIPT_URL" > /tmp/t.txt 2>"$log"
          t_rc=$?
          yt-dlp -f "worst[ext=mp4]/worst" --max-filesize 30M --no-warnings \
            -o /tmp/canary.mp4 "$FIXTURE_DOWNLOAD_URL" 2>>"$log"
          d_rc=$?
          set -e
          if [ "$t_rc" -eq 0 ] && [ -s /tmp/t.txt ] && [ "$d_rc" -eq 0 ] && [ -s /tmp/canary.mp4 ]; then
            echo "network tests passed"
            head -3 /tmp/t.txt
          elif grep -q "Sign in to confirm" "$log"; then
            echo "::warning::YouTube bot-checked the runner IP — network test inconclusive (not a toolkit failure; user sessions use different egress)"
          else
            echo "network test failed for a reason other than the datacenter bot-check:" >&2
            cat "$log" >&2
            exit 1
          fi
      - name: Log latest upstream release (informational)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name
      - name: Open issue on failure (deduped)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create canary-failure --color D93F0B \
            --description "Weekly yt-dlp smoke test failed" --force || true
          open=$(gh issue list --label canary-failure --state open --json number --jq length)
          if [ "$open" -eq 0 ]; then
            gh issue create --title "Canary failure: yt-dlp smoke test failed $(date -u +%F)" \
              --label canary-failure \
              --body "The weekly canary failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Likely a YouTube extractor change — check https://github.com/yt-dlp/yt-dlp/issues and whether the nightly channel already has a fix. Users are unaffected once upstream fixes land (bootstrap reinstalls nightly per session)."
          fi
      - name: Keepalive (prevent 60-day scheduled-workflow auto-disable)
        if: success()
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "days since last commit: $days"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: canary keepalive (no code changes)"
            git push
          fi
